<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>MyTicker</title>
    <link rel="stylesheet" href="brand.css" />
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }

      body {
        min-width: 340px;
        max-width: 340px;
        padding: 14px 16px 16px;
        font: var(--weight-body) var(--text-body)/1.4 var(--font-sans);
        font-variant-numeric: tabular-nums;
        background: var(--bg);
        color: var(--text-primary);
        -webkit-font-smoothing: antialiased;
      }

      /* ── Header ── */
      .header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        margin-bottom: 12px;
      }
      .header-left {
        display: flex;
        align-items: center;
        gap: 8px;
      }
      .header-left img {
        width: 22px;
        height: 22px;
        border-radius: 5px;
      }
      .header-left h1 {
        font-size: var(--text-title-sm);
        font-weight: var(--weight-section);
        letter-spacing: -0.02em;
      }
      .header-actions {
        display: flex;
        align-items: center;
        gap: 4px;
      }
      .icon-btn {
        width: 32px;
        height: 32px;
        border: 1px solid var(--border);
        border-radius: 8px;
        background: transparent;
        color: var(--text-secondary);
        cursor: pointer;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 16px;
        font-weight: 500;
        font-family: inherit;
        transition: background var(--motion-fast) var(--ease-out), color var(--motion-fast) var(--ease-out), transform var(--motion-fast) var(--ease-out);
      }
      .icon-btn:hover {
        background: var(--brand-gold-muted);
        color: var(--brand-gold-hover);
      }
      .icon-btn:active {
        background: var(--brand-gold-muted);
        color: var(--brand-gold-hover);
        transform: scale(0.96);
      }
      .icon-btn:focus-visible {
        outline: 2px solid var(--brand-gold);
        outline-offset: 2px;
      }
      .icon-btn svg {
        width: 16px;
        height: 16px;
        stroke: currentColor;
        fill: none;
        stroke-width: 1.75;
        stroke-linecap: round;
        stroke-linejoin: round;
      }

      /* ── Tabs ── */
      .tabs {
        display: flex;
        gap: 0;
        border-bottom: 1px solid var(--border);
        margin-bottom: 14px;
      }
      .tab {
        flex: 1;
        padding: 10px 8px;
        border: none;
        background: transparent;
        color: var(--text-tertiary);
        font-size: var(--text-body);
        font-weight: var(--weight-section);
        font-family: inherit;
        cursor: pointer;
        position: relative;
        transition: color var(--motion-fast) var(--ease-out);
      }
      .tab:hover { color: var(--text-secondary); }
      .tab[aria-selected="true"] {
        color: var(--text-primary);
      }
      .tab[aria-selected="true"]::after {
        content: "";
        position: absolute;
        left: 20%;
        right: 20%;
        bottom: -1px;
        height: 2px;
        border-radius: 2px 2px 0 0;
        background: var(--brand-gold);
      }
      .tab:focus-visible {
        outline: 2px solid var(--brand-gold);
        outline-offset: -2px;
      }

      /* ── Hero card ── */
      .hero-card {
        background: var(--bg-surface);
        border: 1px solid var(--border);
        border-radius: 10px;
        padding: 16px;
        margin-bottom: 14px;
        box-shadow: var(--material-elevated-shadow);
      }
      .hero-top {
        display: flex;
        align-items: center;
        justify-content: space-between;
        margin-bottom: 6px;
      }
      .hero-label {
        font-size: var(--text-label);
        font-weight: var(--weight-label);
        color: var(--text-tertiary);
      }
      .live-pill {
        display: inline-flex;
        align-items: center;
        gap: 5px;
        font-size: var(--text-meta);
        font-weight: var(--weight-label);
        color: var(--text-tertiary);
      }
      .live-pill .dot {
        width: 6px;
        height: 6px;
        border-radius: 50%;
        background: var(--green);
      }
      .live-pill.is-stale .dot {
        background: var(--yellow);
      }
      .pnl-row {
        display: flex;
        align-items: baseline;
        gap: 10px;
        margin-bottom: 14px;
      }
      .pnl-value {
        font-size: 1.75rem;
        font-weight: var(--weight-display);
        letter-spacing: -0.03em;
        line-height: 1.1;
        font-variant-numeric: tabular-nums;
      }
      .pnl-pct {
        font-size: 0.875rem;
        font-weight: var(--weight-section);
        font-variant-numeric: tabular-nums;
      }
      .pnl-positive { color: var(--green); }
      .pnl-negative { color: var(--red); }
      .pnl-flat { color: var(--text-secondary); }

      .stat-grid {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 8px;
        margin-bottom: 12px;
      }
      .stat-cell {
        background: var(--bg-inset);
        border-radius: var(--radius-sm);
        padding: 10px 12px;
      }
      .stat-cell-label {
        font-size: var(--text-meta);
        color: var(--text-tertiary);
        margin-bottom: 4px;
        font-weight: var(--weight-label);
      }
      .stat-cell-value {
        font-size: 0.875rem;
        font-weight: var(--weight-section);
        font-variant-numeric: tabular-nums;
        color: var(--text-primary);
        letter-spacing: -0.01em;
      }
      .stat-cell-value .sub {
        font-size: var(--text-label);
        font-weight: var(--weight-label);
        margin-left: 4px;
        color: var(--text-secondary);
      }

      .help-row {
        font-size: 11px;
        color: var(--text-tertiary);
        line-height: 1.4;
        display: flex;
        align-items: center;
        gap: 4px;
        flex-wrap: wrap;
      }
      .help-row a {
        color: var(--brand-gold);
        text-decoration: none;
      }
      .help-row a:hover {
        color: var(--brand-gold-hover);
        text-decoration: underline;
      }
      .help-row a:focus-visible {
        outline: 2px solid var(--brand-gold);
        outline-offset: 2px;
        border-radius: 2px;
      }

      /* ── Movers ── */
      .section-head {
        display: flex;
        align-items: center;
        justify-content: space-between;
        margin-bottom: 8px;
      }
      .section-head .label {
        font-size: var(--text-label);
        font-weight: var(--weight-section);
        color: var(--text-secondary);
      }
      .section-head .link-quiet {
        font-size: var(--text-label);
        font-weight: var(--weight-label);
        color: var(--brand-gold);
        background: none;
        border: none;
        cursor: pointer;
        font-family: inherit;
        min-width: 32px;
        min-height: 32px;
        padding: 0 4px;
      }
      .section-head .link-quiet:hover {
        color: var(--brand-gold-hover);
      }
      .section-head .link-quiet:focus-visible {
        outline: 2px solid var(--brand-gold);
        outline-offset: 2px;
      }

      .movers-section {
        margin-bottom: 14px;
        padding: 12px 14px 2px;
        background: var(--bg-surface);
        border: 1px solid var(--border);
        border-radius: 10px;
        box-shadow: var(--material-elevated-shadow);
      }
      .mover-item {
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 10px 0;
        border-bottom: 1px solid var(--border);
        cursor: default;
      }
      .mover-item:last-child { border-bottom: none; }
      .mover-name {
        font-size: var(--text-body);
        font-weight: var(--weight-label);
        letter-spacing: -0.01em;
      }
      .mover-right {
        display: flex;
        align-items: baseline;
        gap: 10px;
      }
      .mover-money {
        font-size: var(--text-label);
        font-weight: var(--weight-label);
        font-variant-numeric: tabular-nums;
      }
      .mover-change {
        font-size: var(--text-label);
        font-weight: var(--weight-section);
        font-variant-numeric: tabular-nums;
        min-width: 3.6rem;
        text-align: right;
      }

      /* ── Watchlist tab ── */
      .watchlist-panel { min-height: 120px; }
      .watchlist-item {
        display: grid;
        grid-template-columns: minmax(0, 1fr) auto auto auto auto;
        gap: 8px;
        align-items: center;
        padding: 10px 0;
        border-bottom: 1px solid var(--border);
      }
      .watch-symbol {
        font-size: var(--text-body);
        font-weight: var(--weight-label);
        min-width: 0;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
      .watch-asset {
        font-size: var(--text-meta);
        font-weight: var(--weight-body);
        color: var(--text-tertiary);
        white-space: nowrap;
      }
      .watch-price {
        font-size: var(--text-label);
        font-weight: var(--weight-label);
        color: var(--text-secondary);
        font-variant-numeric: tabular-nums;
      }
      .watch-change {
        font-size: var(--text-label);
        font-weight: var(--weight-section);
        font-variant-numeric: tabular-nums;
        min-width: 48px;
        text-align: right;
      }
      .watch-remove {
        background: none;
        border: none;
        color: var(--text-tertiary);
        cursor: pointer;
        font-size: 16px;
        min-width: 32px;
        min-height: 32px;
        border-radius: 6px;
        opacity: 0.6;
      }
      .watch-remove:hover { opacity: 1; color: var(--red); }
      .watch-remove:focus-visible {
        outline: 2px solid var(--brand-gold);
        outline-offset: 2px;
        opacity: 1;
      }
      .watchlist-empty {
        padding: 28px 12px;
        text-align: center;
        font-size: var(--text-body);
        font-weight: var(--weight-body);
        color: var(--text-tertiary);
        line-height: 1.45;
      }
      /* ── Checklist / empty ── */
      .setup-checklist .label,
      .empty-state .title {
        font-size: var(--text-body);
        font-weight: var(--weight-section);
        margin-bottom: 10px;
      }
      .checklist-item {
        display: flex;
        gap: 10px;
        align-items: flex-start;
        padding: 10px 0;
        border-bottom: 1px solid var(--border);
        width: 100%;
        text-align: left;
        background: transparent;
        border-left: none;
        border-right: none;
        border-top: none;
        color: inherit;
        font-family: inherit;
        min-height: 44px;
      }
      button.checklist-item { cursor: pointer; border-radius: 8px; }
      button.checklist-item:hover { background: var(--bg-hover); }
      button.checklist-item:focus-visible {
        outline: 2px solid var(--brand-gold);
        outline-offset: 2px;
      }
      .checklist-item.done {
        min-height: 0;
        padding: 6px 0;
        color: var(--text-secondary);
      }
      .checklist-item.done .check-hint { display: none; }
      .check-icon {
        width: 24px;
        height: 24px;
        border-radius: 999px;
        background: var(--bg-hover);
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 11px;
        font-weight: 600;
        flex-shrink: 0;
      }
      .checklist-item.done .check-icon {
        background: var(--bg-surface);
        border: 1px solid color-mix(in srgb, var(--green) 45%, transparent);
        color: var(--green);
      }
      .check-label {
        font-size: var(--text-body);
        font-weight: var(--weight-section);
      }
      .check-hint {
        font-size: var(--text-meta);
        font-weight: var(--weight-body);
        color: var(--text-tertiary);
        margin-top: 2px;
        line-height: 1.4;
      }
      .btn-setup {
        width: 100%;
        margin-top: 14px;
        padding: 12px;
        min-height: 44px;
        border: none;
        border-radius: var(--radius-sm);
        background: var(--brand-gold);
        color: var(--brand-gold-ink);
        font-size: var(--text-body);
        font-weight: var(--weight-section);
        cursor: pointer;
        font-family: inherit;
      }
      .btn-setup:hover { background: var(--brand-gold-hover); }
      .btn-setup:focus-visible {
        outline: 2px solid var(--brand-gold);
        outline-offset: 2px;
      }
      .empty-state { padding: 8px 0; }
      .empty-state .subtitle {
        font-size: var(--text-label);
        font-weight: var(--weight-body);
        color: var(--text-secondary);
        line-height: 1.45;
      }

      .loading-state {
        text-align: center;
        padding: 32px;
        color: var(--text-tertiary);
        font-size: var(--text-body);
        font-weight: var(--weight-body);
      }
      .sr-only {
        position: absolute;
        width: 1px;
        height: 1px;
        padding: 0;
        margin: -1px;
        overflow: hidden;
        clip: rect(0,0,0,0);
        border: 0;
      }

      @media (prefers-reduced-motion: reduce) {
        .icon-btn:active { transform: none; }
      }

      @media (prefers-contrast: more) {
        .icon-btn {
          background: var(--bg-surface);
          border-color: var(--border);
        }
        .icon-btn:focus-visible {
          outline-color: var(--brand-gold);
        }
      }
    </style>
  </head>
  <body>
    <div class="header">
      <div class="header-left">
        <img src="icons/icon32.png" alt="" />
        <h1>MyTicker</h1>
      </div>
      <div class="header-actions">
        <button type="button" class="icon-btn" id="openOptions" aria-label="Settings" title="Settings">

          </svg>
        </button>
      </div>
    </div>

    <div class="tabs" role="tablist" aria-label="Popup sections">
      <button type="button" class="tab" role="tab" id="tabHoldings" aria-selected="true" aria-controls="panelHoldings" tabindex="0">Holdings</button>
      <button type="button" class="tab" role="tab" id="tabWatchlist" aria-selected="false" aria-controls="panelWatchlist" tabindex="-1">Watchlist</button>
    </div>

    <div id="mainContent">
      <div id="panelHoldings" role="tabpanel" aria-labelledby="tabHoldings"></div>
      <div id="panelWatchlist" role="tabpanel" aria-labelledby="tabWatchlist" hidden></div>
    </div>
    <script type="module" src="popup.js"></script>
  </body>
</html>
