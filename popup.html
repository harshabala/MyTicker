<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>MyTicker</title>
    <link rel="stylesheet" href="brand.css" />
    <style>
      :root {
        --bg-primary: var(--bg);
        --bg-card: var(--bg-surface);
        --bg-card-hover: var(--bg-hover);
        --radius: var(--radius-sm);
        --font-display: "SF Pro Display", -apple-system, BlinkMacSystemFont, system-ui, sans-serif;
      }

      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      body {
        min-width: 320px;
        max-width: 320px;
        padding: var(--space-4, 16px);
        font: 100%/1.45 var(--font-sans);
        background: var(--bg-primary);
        color: var(--text-primary);
        -webkit-font-smoothing: antialiased;
        -moz-osx-font-smoothing: grayscale;
        letter-spacing: 0;
      }

      /* Header */
      .header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        margin-bottom: 16px;
      }

      .header-left {
        display: flex;
        align-items: center;
        gap: 8px;
      }

      .header-left img {
        width: 20px;
        height: 20px;
        border-radius: 4px;
      }

      .header-left h1 {
        font-family: var(--font-display);
        font-size: 15px;
        font-weight: 600;
        letter-spacing: -0.02em; /* display: negative tracking */
        line-height: 1.2;
        font-optical-sizing: auto;
      }

      /* Toggle switch */
      .toggle-row {
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 12px 0;
        background: transparent;
        border: none;
        border-bottom: 1px solid var(--border);
        border-radius: 0;
        margin-bottom: 12px;
        box-shadow: none;
        min-height: 44px;
      }

      .toggle-label {
        font-size: 13px;
        font-weight: 500;
        color: var(--text-primary);
        letter-spacing: -0.01em;
      }

      .toggle-btn,
      .btn-secondary {
        background: transparent;
        color: var(--text-primary);
        border: 1px solid var(--border);
        transition:
          background var(--motion-fast) var(--ease-out),
          border-color var(--motion-fast) var(--ease-out),
          transform var(--motion-press) var(--ease-press);
      }

      .toggle-btn:hover,
      .btn-secondary:hover {
        background: rgba(255, 255, 255, 0.08);
        border-color: var(--accent);
      }

      /* Feedback on press (pointer-down), not only release */
      .toggle-btn:active,
      .btn-secondary:active {
        background: rgba(255, 255, 255, 0.12);
        transform: scale(0.97);
      }

      /* Classic iOS switch — fixed geometry, thumb vertically centered */
      .toggle-switch {
        position: relative;
        display: inline-block;
        width: 42px;
        height: 26px;
        flex-shrink: 0;
        cursor: pointer;
        margin: 0;
        padding: 0;
        vertical-align: middle;
      }

      .toggle-switch input {
        opacity: 0;
        width: 0;
        height: 0;
        position: absolute;
      }

      .toggle-slider {
        position: absolute;
        inset: 0;
        background: var(--bg-tertiary);
        border-radius: 999px;
        transition: background var(--motion-medium) var(--ease-out);
      }

      .toggle-slider::before {
        content: "";
        position: absolute;
        left: 2px;
        top: 50%;
        width: 22px;
        height: 22px;
        margin-top: -11px;
        background: #fff;
        border-radius: 50%;
        box-shadow: 0 1px 2px rgba(0, 0, 0, 0.35);
        transition: transform var(--motion-medium) var(--ease-out);
      }

      .toggle-switch input:checked + .toggle-slider {
        background: var(--accent);
      }

      .toggle-switch input:checked + .toggle-slider::before {
        transform: translateX(16px);
      }

      /* Summary — single instrument surface, not dashboard card farm */
      .summary-card {
        background: transparent;
        border: none;
        border-radius: 0;
        padding: 0 0 12px;
        margin-bottom: 12px;
        box-shadow: none;
        border-bottom: 1px solid var(--border);
      }

      .summary-card .label {
        font-size: var(--text-label, 12px);
        font-weight: 600;
        color: var(--text-secondary);
        margin-bottom: 4px;
        letter-spacing: 0;
        line-height: 1.3;
      }

      .pnl-row {
        display: flex;
        align-items: baseline;
        gap: 8px;
        margin-bottom: 2px;
      }

      .pnl-value {
        font-family: var(--font-display);
        font-size: var(--text-display, 1.5rem);
        font-weight: 700;
        letter-spacing: -0.03em;
        line-height: 1.1;
        font-variant-numeric: tabular-nums;
        font-optical-sizing: auto;
      }

      .pnl-pct {
        font-size: var(--text-body, 13px);
        font-weight: 600;
        letter-spacing: -0.01em;
        font-variant-numeric: tabular-nums;
      }

      .holdings-count {
        font-size: var(--text-meta, 11px);
        color: var(--text-tertiary);
        margin-top: 4px;
        line-height: 1.4;
      }

      .pnl-positive { color: var(--green); }
      .pnl-negative { color: var(--red); }
      .pnl-flat { color: var(--text-secondary); }

      /* Visually hidden (a11y live region) */
      .sr-only {
        position: absolute;
        width: 1px;
        height: 1px;
        padding: 0;
        margin: -1px;
        overflow: hidden;
        clip: rect(0, 0, 0, 0);
        white-space: nowrap;
        border: 0;
      }

      .window5m-row {
        display: flex;
        align-items: baseline;
        gap: 6px;
        margin-top: 6px;
        font-variant-numeric: tabular-nums;
      }

      .window5m-label {
        font-size: 11px;
        font-weight: 600;
        color: var(--text-tertiary);
        letter-spacing: 0.01em;
        min-width: 2.5rem;
      }

      .window5m-value {
        font-size: 13px;
        font-weight: 600;
        letter-spacing: -0.01em;
      }

      .window5m-pct {
        font-size: 12px;
        font-weight: 500;
      }

      .meta-line {
        font-size: 11px;
        color: var(--text-tertiary);
        margin-top: 8px;
        line-height: 1.4;
        letter-spacing: 0.01em;
      }

      .meta-line.is-stale {
        color: var(--yellow);
      }

      .help-row {
        font-size: 11px;
        margin-top: 6px;
        line-height: 1.4;
      }

      .help-row a {
        color: var(--accent);
        text-decoration: none;
      }

      .help-row a:hover {
        text-decoration: underline;
      }

      .privacy-inline {
        color: var(--text-tertiary);
      }

      .stale-action {
        width: 100%;
        margin-bottom: 12px;
        padding: 8px 10px;
        border: 1px solid rgba(255, 214, 10, 0.35);
        border-radius: var(--radius-sm);
        background: rgba(255, 214, 10, 0.08);
        color: var(--text-primary);
        font-size: 12px;
        font-weight: 500;
        font-family: inherit;
        cursor: pointer;
        text-align: left;
      }

      .stale-action:focus-visible {
        outline: 2px solid var(--accent);
        outline-offset: 2px;
      }

      /* Top movers: dense list, no hover theater (non-interactive) */
      .movers-section {
        margin-bottom: 12px;
      }

      .movers-section .label {
        font-size: 12px;
        font-weight: 600;
        color: var(--text-secondary);
        margin-bottom: 4px;
        letter-spacing: 0.01em;
      }

      .mover-item {
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 7px 0;
        border-bottom: 1px solid var(--border);
        cursor: default;
      }

      .mover-item:last-child {
        border-bottom: none;
      }

      .mover-name {
        font-size: 13px;
        font-weight: 500;
        letter-spacing: -0.01em;
      }

      .mover-right {
        display: flex;
        align-items: baseline;
        gap: 8px;
      }

      .mover-money {
        font-size: 12px;
        font-weight: 500;
        font-variant-numeric: tabular-nums;
      }

      .mover-change {
        font-size: 12px;
        font-weight: 600;
        letter-spacing: -0.01em;
        font-variant-numeric: tabular-nums;
        min-width: 3.5rem;
        text-align: right;
      }

      /* Footer link */
      .footer {
        text-align: center;
        margin-top: 4px;
      }

      .footer a {
        font-size: var(--text-label, 12px);
        color: var(--text-secondary);
        text-decoration: none;
        cursor: pointer;
        opacity: 1;
        transition: color var(--motion-fast) var(--ease-out);
      }

      .footer a:hover {
        color: var(--accent);
        text-decoration: none;
      }

      /* Empty state (no emoji residue) */
      .empty-state {
        text-align: left;
        padding: 8px 2px 4px;
      }

      .empty-state .title {
        font-size: 14px;
        font-weight: 600;
        margin-bottom: 6px;
        letter-spacing: -0.01em;
      }

      .empty-state .subtitle {
        font-size: 12px;
        color: var(--text-secondary);
        line-height: 1.45;
      }

      /* Keyboard shortcut hint */
      .shortcut-hint {
        text-align: center;
        font-size: 10px;
        color: var(--text-tertiary);
        margin-top: 8px;
      }

      .shortcut-hint kbd {
        background: rgba(255, 255, 255, 0.06);
        padding: 1px 5px;
        border-radius: 3px;
        font-family: inherit;
        font-size: 10px;
        border: 1px solid var(--border);
      }

      .loading-state {
        text-align: center;
        padding: 24px;
        color: var(--text-tertiary);
        font-size: 13px;
      }

      /* View machine: opacity cross-fade only (symmetric path) */
      .popup-view {
        transition: opacity var(--motion-medium) var(--ease-out);
      }

      .popup-view.view-enter {
        opacity: 0;
      }

      .popup-view.view-exit {
        opacity: 0;
      }

      /* Sign-change feedback: brief dim, not a flashy keyframe bounce */
      .summary-card.pnl-flash {
        animation: pnl-flash var(--motion-medium) var(--ease-out);
      }

      @keyframes pnl-flash {
        0% { opacity: 1; }
        40% { opacity: 0.72; }
        100% { opacity: 1; }
      }

      /* Checklist enter: short opacity stagger (no large travel) */
      .checklist-stagger .checklist-item {
        opacity: 0;
        animation: checklist-stagger var(--motion-medium) var(--ease-out) forwards;
        animation-delay: calc(var(--stagger-index, 0) * 40ms + 20ms);
      }

      @keyframes checklist-stagger {
        to {
          opacity: 1;
        }
      }

      @media (prefers-reduced-motion: reduce) {
        .checklist-stagger .checklist-item {
          opacity: 1;
          animation: none;
        }

        .summary-card.pnl-flash {
          animation: none;
        }

        .popup-view {
          transition: none;
        }
      }

      .setup-checklist {
        border-bottom: none;
        padding-bottom: 0;
      }

      .setup-checklist .checklist-item {
        display: flex;
        gap: 10px;
        align-items: flex-start;
        padding: 10px 0;
        margin: 0;
        border-bottom: 1px solid var(--border);
        width: 100%;
        text-align: left;
        background: transparent;
        border-left: none;
        border-right: none;
        border-top: none;
        color: inherit;
        font-family: inherit;
        cursor: default;
        min-height: 44px;
        box-sizing: border-box;
      }

      button.checklist-item {
        cursor: pointer;
        border-radius: var(--radius-sm);
      }

      button.checklist-item:hover {
        background: rgba(255, 255, 255, 0.05);
      }

      button.checklist-item:focus-visible {
        outline: 2px solid var(--accent);
        outline-offset: 2px;
      }

      .setup-checklist .checklist-item:last-of-type {
        border-bottom: none;
      }

      .setup-checklist .checklist-item.done {
        min-height: 0;
        padding-top: 6px;
        padding-bottom: 6px;
        opacity: 0.72;
      }

      .setup-checklist .checklist-item.done .check-hint {
        display: none;
      }

      .setup-checklist .check-icon {
        width: 24px;
        height: 24px;
        border-radius: 999px;
        background: var(--bg-hover);
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 11px;
        font-weight: 600;
        flex-shrink: 0;
        transition: background var(--motion-fast) var(--ease-out), color var(--motion-fast) var(--ease-out);
      }

      .setup-checklist .checklist-item.done .check-icon {
        background: var(--accent-muted);
        color: var(--accent);
      }

      .check-label {
        font-size: 13px;
        font-weight: 600;
        letter-spacing: -0.01em;
        line-height: 1.3;
      }

      .check-hint {
        font-size: 11px;
        color: var(--text-tertiary);
        margin-top: 3px;
        line-height: 1.4;
        letter-spacing: 0.01em;
      }



      /* First-value: opacity only (state feedback, not decorative scale) */
      .summary-card.first-value {
        animation: first-value-in var(--motion-medium) var(--ease-out) both;
      }

      @keyframes first-value-in {
        from { opacity: 0.4; }
        to { opacity: 1; }
      }

      @media (prefers-reduced-motion: reduce) {
        .summary-card.first-value {
          animation: none;
        }
      }

      .btn-setup {
        width: 100%;
        margin-top: 12px;
        padding: 12px 10px;
        min-height: 44px;
        border: none;
        border-radius: var(--radius-sm);
        background: var(--accent);
        color: #0a0a0a;
        font-size: var(--text-body, 13px);
        font-weight: 600;
        letter-spacing: -0.01em;
        cursor: pointer;
        font-family: inherit;
        transition:
          background var(--motion-fast) var(--ease-out),
          transform var(--motion-press) var(--ease-press);
      }

      .btn-setup:hover {
        background: var(--accent-hover);
      }

      .footer a:active {
        transform: scale(0.98);
      }

      .btn-setup:focus-visible,
      .footer a:focus-visible,
      #openOptions:focus-visible {
        outline: 2px solid var(--accent);
        outline-offset: 2px;
        border-radius: 4px;
      }

      .toggle-switch input:focus-visible + .toggle-slider {
        outline: 2px solid var(--accent);
        outline-offset: 2px;
        border-radius: 999px;
      }

      /* Watchlist section styles */
      .watchlist-section {
        background: transparent;
        border: none;
        border-top: 1px solid var(--border);
        border-radius: 0;
        margin-bottom: 12px;
        overflow: hidden;
        box-shadow: none;
        padding-top: 8px;
      }
      .watchlist-header {
        /* Match movers .label — no uppercase tracked eyebrow */
        padding: 10px 12px 4px;
        margin: 0;
      }
      .watchlist-item {
        display: grid;
        grid-template-columns: 1fr auto auto auto;
        gap: 6px;
        align-items: center;
        padding: 6px 12px;
        border-top: 1px solid var(--border);
      }
      .watch-symbol {
        font-size: 12px;
        font-weight: 500;
      }
      .watch-price {
        font-size: 11px;
        color: var(--text-secondary);
        font-variant-numeric: tabular-nums;
        text-align: right;
      }
      .watch-change {
        font-size: 11px;
        font-variant-numeric: tabular-nums;
        min-width: 48px;
        text-align: right;
      }
      .watch-remove {
        background: none;
        border: none;
        color: var(--text-tertiary);
        cursor: pointer;
        font-size: 15px;
        line-height: 1;
        min-width: 28px;
        min-height: 28px;
        padding: 4px;
        opacity: 0.55;
        transition: opacity var(--motion-fast) var(--ease-out), color var(--motion-fast) var(--ease-out);
        border-radius: 4px;
      }
      .watch-remove:hover { opacity: 1; color: var(--red); }
      .watch-remove:focus-visible {
        outline: 2px solid var(--accent);
        outline-offset: 1px;
        opacity: 1;
      }
      .watchlist-empty {
        padding: 8px 12px 10px;
        font-size: 12px;
        color: var(--text-secondary);
        line-height: 1.4;
        border-top: 1px solid var(--border);
      }
      .watchlist-add {
        display: flex;
        gap: 5px;
        align-items: center;
        padding: 8px 10px 9px;
        border-top: 1px solid var(--border);
      }
      .watchlist-input {
        flex: 1;
        min-width: 0;
        background: var(--bg-hover);
        border: 1px solid var(--border);
        border-radius: var(--radius-sm);
        color: var(--text-primary);
        font-size: 12px;
        padding: 4px 7px;
        font-family: var(--font-mono);
        text-transform: uppercase;
        outline: none;
      }
      .watchlist-input::placeholder { text-transform: none; color: var(--text-tertiary); }
      .watchlist-input:focus-visible {
        border-color: var(--border-focus);
        box-shadow: var(--focus-ring);
      }
      .watchlist-exchange {
        background: var(--bg-hover);
        border: 1px solid var(--border);
        border-radius: var(--radius-sm);
        color: var(--text-secondary);
        font-size: 11px;
        padding: 4px 3px;
        width: 50px;
        font-family: inherit;
      }
      .watchlist-exchange:focus-visible {
        outline: 2px solid var(--accent);
        outline-offset: 1px;
      }
      .watchlist-add-btn {
        background: var(--accent);
        border: none;
        border-radius: var(--radius-sm);
        color: #0a0a0a;
        font-size: 16px;
        font-weight: 600;
        width: 36px;
        height: 36px;
        min-width: 36px;
        min-height: 36px;
        cursor: pointer;
        display: flex;
        align-items: center;
        justify-content: center;
        flex-shrink: 0;
        line-height: 1;
        transition:
          background var(--motion-fast) var(--ease-out),
          transform var(--motion-press) var(--ease-press);
      }
      .watchlist-add-btn:hover { background: var(--accent-hover); }
      .watchlist-add-btn:focus-visible {
        outline: 2px solid var(--accent);
        outline-offset: 2px;
      }

      .btn-setup:active,
      .watchlist-add-btn:active,
      .watch-remove:active,
      .footer a:active {
        transform: scale(0.97);
        transition: transform var(--motion-press) var(--ease-press);
      }

      @media (prefers-reduced-transparency: reduce) {
        .summary-card,
        .toggle-row,
        .watchlist-section {
          box-shadow: none;
          background: #1c1c1e;
        }
      }
    </style>
  </head>
  <body>
    <div class="header">
      <div class="header-left">
        <img src="icons/icon32.png" alt="MyTicker" />
        <h1>MyTicker</h1>
      </div>
    </div>

    <div class="toggle-row">
      <span class="toggle-label" id="toggleLabel">Ticker strip</span>
      <label class="toggle-switch">
        <input type="checkbox" id="enabledToggle" aria-labelledby="toggleLabel" />
        <span class="toggle-slider"></span>
      </label>
    </div>

    <div id="mainContent">
      <!-- Dynamically filled by popup.js -->
    </div>

    <div class="footer">
      <a id="openOptions" href="#">Open settings →</a>
    </div>

    <div class="shortcut-hint" id="shortcutHint"></div>

    <script type="module" src="popup.js"></script>
  </body>
</html>
