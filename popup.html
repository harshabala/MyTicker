<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>MyTicker</title>
    <link rel="stylesheet" href="brand.css" />
    <style>
      :root {
        --bg-primary: var(--bg);
        --bg-card: var(--bg-surface);
        --bg-card-hover: var(--bg-hover);
        --radius: var(--radius-sm);
        --font-display: "SF Pro Display", -apple-system, BlinkMacSystemFont, system-ui, sans-serif;
      }

      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      body {
        min-width: 320px;
        max-width: 320px;
        padding: 16px;
        font-family: var(--font-sans);
        background: var(--bg-primary);
        color: var(--text-primary);
        -webkit-font-smoothing: antialiased;
        -moz-osx-font-smoothing: grayscale;
      }

      /* Header */
      .header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        margin-bottom: 16px;
      }

      .header-left {
        display: flex;
        align-items: center;
        gap: 8px;
      }

      .header-left img {
        width: 20px;
        height: 20px;
        border-radius: 4px;
      }

      .header-left h1 {
        font-family: var(--font-display);
        font-size: 15px;
        font-weight: 600;
        letter-spacing: -0.02em;
      }

      .version-badge {
        font-size: 10px;
        color: var(--text-tertiary);
        background: rgba(255, 255, 255, 0.04);
        padding: 2px 6px;
        border-radius: 4px;
        font-weight: 500;
      }

      /* Toggle switch */
      .toggle-row {
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 10px 12px;
        background: var(--bg-card);
        border: 1px solid var(--border);
        border-radius: var(--radius);
        margin-bottom: 12px;
      }

      .toggle-label {
        font-size: 13px;
        color: var(--text-primary);
      }

      .toggle-btn,
      .btn-secondary {
        background: transparent;
        color: var(--text-primary);
        border: 1px solid var(--border);
        transition: all 0.15s ease;
      }

      .toggle-btn:hover,
      .btn-secondary:hover {
        background: rgba(255, 255, 255, 0.08);
        border-color: var(--accent);
      }

      .toggle-btn:active,
      .btn-secondary:active {
        background: rgba(255, 255, 255, 0.12);
        transform: scale(0.97);
      }

      .toggle-switch {
        position: relative;
        width: 38px;
        height: 22px;
        cursor: pointer;
      }

      .toggle-switch input {
        opacity: 0;
        width: 0;
        height: 0;
      }

      .toggle-slider {
        position: absolute;
        inset: 0;
        background: var(--bg-tertiary);
        border-radius: 11px;
        transition: background 0.2s ease;
      }

      .toggle-slider::before {
        content: "";
        position: absolute;
        left: 3px;
        top: 3px;
        width: 16px;
        height: 16px;
        background: white;
        border-radius: 50%;
        transition: transform 0.2s ease;
      }

      .toggle-switch input:checked + .toggle-slider {
        background: var(--accent);
      }

      .toggle-switch input:checked + .toggle-slider::before {
        transform: translateX(16px);
      }

      /* Summary card */
      .summary-card {
        background: var(--bg-card);
        border: 1px solid var(--border);
        border-radius: var(--radius);
        padding: 14px;
        margin-bottom: 12px;
      }

      .summary-card .label {
        font-size: 12px;
        font-weight: 600;
        color: #a8a8ad;
        margin-bottom: 6px;
      }

      .pnl-row {
        display: flex;
        align-items: baseline;
        gap: 8px;
        margin-bottom: 2px;
      }

      .pnl-value {
        font-family: var(--font-display);
        font-size: 22px;
        font-weight: 700;
        letter-spacing: -0.03em;
        font-variant-numeric: tabular-nums;
      }

      .pnl-pct {
        font-size: 13px;
        font-weight: 500;
        font-variant-numeric: tabular-nums;
      }

      .holdings-count {
        font-size: 12px;
        color: var(--text-tertiary);
        margin-top: 4px;
      }

      .pnl-positive { color: var(--green); }
      .pnl-negative { color: var(--red); }
      .pnl-flat { color: var(--text-secondary); }

      /* Status bar */
      .status-bar {
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 8px 12px;
        background: var(--bg-card);
        border: 1px solid var(--border);
        border-radius: var(--radius);
        margin-bottom: 12px;
      }

      .status-dot {
        width: 6px;
        height: 6px;
        border-radius: 50%;
        background: var(--green);
        margin-right: 6px;
        display: inline-block;
        animation: pulse-dot 2s ease-in-out infinite;
      }

      .status-dot.disconnected {
        background: var(--red);
        animation: none;
      }

      .status-dot.stale {
        background: var(--yellow);
      }

      .status-text {
        font-size: 11px;
        color: var(--text-tertiary);
        display: flex;
        align-items: center;
      }

      .status-time {
        font-size: 11px;
        color: var(--text-tertiary);
      }

      @keyframes pulse-dot {
        0%, 100% { opacity: 1; }
        50% { opacity: 0.3; }
      }

      /* Top movers */
      .movers-section {
        margin-bottom: 12px;
      }

      .movers-section .label {
        font-size: 12px;
        font-weight: 600;
        color: #a8a8ad;
        margin-bottom: 8px;
      }

      .mover-item {
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 8px 12px;
        background: var(--bg-card);
        border: 1px solid var(--border);
        border-radius: 8px;
        margin-bottom: 4px;
        transition: background 0.15s ease;
      }

      .mover-item:hover {
        background: var(--bg-card-hover);
      }

      .mover-name {
        font-size: 13px;
        font-weight: 500;
      }

      .mover-change {
        font-size: 12px;
        font-weight: 500;
        font-variant-numeric: tabular-nums;
      }

      /* Footer link */
      .footer {
        text-align: center;
        margin-top: 4px;
      }

      .footer a {
        font-size: 12px;
        color: var(--accent);
        text-decoration: none;
        cursor: pointer;
        opacity: 0.8;
        transition: opacity 0.15s;
      }

      .footer a:hover {
        opacity: 1;
        text-decoration: underline;
      }

      /* Empty state */
      .empty-state {
        text-align: center;
        padding: 24px 12px;
      }

      .empty-state .emoji {
        font-size: 28px;
        margin-bottom: 8px;
      }

      .empty-state .title {
        font-size: 14px;
        font-weight: 600;
        margin-bottom: 4px;
      }

      .empty-state .subtitle {
        font-size: 12px;
        color: var(--text-tertiary);
        line-height: 1.5;
      }

      /* Keyboard shortcut hint */
      .shortcut-hint {
        text-align: center;
        font-size: 10px;
        color: var(--text-tertiary);
        margin-top: 8px;
      }

      .shortcut-hint kbd {
        background: rgba(255, 255, 255, 0.06);
        padding: 1px 5px;
        border-radius: 3px;
        font-family: inherit;
        font-size: 10px;
        border: 1px solid var(--border);
      }

      .loading-state {
        text-align: center;
        padding: 24px;
        color: var(--text-tertiary);
        font-size: 13px;
      }

      .popup-view {
        transition: opacity var(--motion-fast, 150ms) var(--ease-out, ease);
      }

      .popup-view.view-enter {
        opacity: 0;
      }

      .popup-view.view-exit {
        opacity: 0;
      }

      .summary-card.pnl-flash {
        animation: pnl-flash var(--motion-fast, 150ms) var(--ease-out, ease);
      }

      @keyframes pnl-flash {
        0% { opacity: 1; }
        45% { opacity: 0.65; }
        100% { opacity: 1; }
      }

      .checklist-stagger .checklist-item {
        opacity: 0;
        transform: translateY(6px);
        animation: checklist-stagger var(--motion-medium, 250ms) var(--ease-out, ease) forwards;
        animation-delay: calc(var(--stagger-index, 0) * 60ms + 40ms);
      }

      @keyframes checklist-stagger {
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }

      @media (prefers-reduced-motion: reduce) {
        .status-dot {
          animation: none;
        }

        .checklist-stagger .checklist-item {
          opacity: 1;
          transform: none;
          animation: none;
        }

        .summary-card.pnl-flash {
          animation: none;
        }
      }

      .setup-checklist .checklist-item {
        display: flex;
        gap: 10px;
        align-items: flex-start;
        padding: 8px 0;
        border-bottom: 1px solid var(--border);
        width: 100%;
        text-align: left;
        background: transparent;
        border-left: none;
        border-right: none;
        border-top: none;
        color: inherit;
        font-family: inherit;
        cursor: default;
      }

      button.checklist-item {
        cursor: pointer;
        border-radius: 6px;
        transition: background 0.15s ease;
      }

      button.checklist-item:hover {
        background: rgba(255, 255, 255, 0.04);
      }

      button.checklist-item:focus-visible {
        outline: 2px solid var(--accent);
        outline-offset: 2px;
      }

      .setup-checklist .checklist-item:last-of-type {
        border-bottom: none;
      }

      .setup-checklist .checklist-item.done {
        padding-top: 4px;
        padding-bottom: 4px;
      }

      .setup-checklist .checklist-item.done .check-hint {
        display: none;
      }

      .setup-checklist .check-icon {
        width: 22px;
        height: 22px;
        border-radius: 999px;
        background: var(--bg-hover);
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 11px;
        font-weight: 600;
        flex-shrink: 0;
      }

      .setup-checklist .checklist-item.done .check-icon {
        background: var(--accent-muted);
        color: var(--accent);
      }

      .check-label {
        font-size: 13px;
        font-weight: 500;
      }

      .check-hint {
        font-size: 11px;
        color: var(--text-tertiary);
        margin-top: 2px;
      }

      .stats-footnote,
      .privacy-line {
        font-size: 11px;
        color: var(--text-tertiary);
        line-height: 1.4;
        margin-top: 8px;
      }

      .stats-footnote a {
        color: var(--accent);
        text-decoration: none;
      }

      .stats-footnote a:hover {
        text-decoration: underline;
      }

      .privacy-line {
        margin-top: 4px;
      }

      .strip-status-line {
        font-size: 11px;
        color: var(--text-tertiary);
        line-height: 1.4;
        margin: 0 0 12px;
        padding: 0 2px;
      }

      .summary-card.first-value {
        position: relative;
      }

      .summary-card.first-value::after {
        content: "";
        position: absolute;
        inset: 0;
        border-radius: inherit;
        pointer-events: none;
        background: linear-gradient(
          105deg,
          transparent 40%,
          rgba(212, 175, 55, 0.12) 50%,
          transparent 60%
        );
        background-size: 200% 100%;
        animation: first-value-shimmer 1.2s ease-out 1;
      }

      @keyframes first-value-shimmer {
        from { background-position: 100% 0; }
        to { background-position: -100% 0; }
      }

      @media (prefers-reduced-motion: reduce) {
        .summary-card.first-value::after {
          animation: none;
          display: none;
        }
      }

      .btn-setup {
        width: 100%;
        margin-top: 12px;
        padding: 10px;
        border: none;
        border-radius: var(--radius-sm);
        background: var(--accent);
        color: #000;
        font-size: 13px;
        font-weight: 600;
        cursor: pointer;
        font-family: inherit;
        transition: background var(--motion-fast, 150ms) ease, transform var(--motion-fast, 150ms) var(--ease-out, ease);
      }

      .btn-setup:hover {
        background: var(--accent-hover);
      }

      .footer a:active {
        transform: scale(0.98);
      }

      .btn-setup:focus-visible,
      .footer a:focus-visible,
      #openOptions:focus-visible {
        outline: 2px solid var(--accent, #22d3ee);
        outline-offset: 2px;
        border-radius: 4px;
      }

      .toggle-switch input:focus-visible + .toggle-slider {
        outline: 2px solid var(--accent, #22d3ee);
        outline-offset: 2px;
        border-radius: 11px;
      }

      /* Watchlist section styles */
      .watchlist-section {
        background: var(--bg-card);
        border: 1px solid var(--border);
        border-radius: var(--radius);
        margin-bottom: 12px;
        overflow: hidden;
      }
      .watchlist-header {
        font-size: 11px;
        font-weight: 500;
        text-transform: uppercase;
        letter-spacing: 0.06em;
        color: var(--text-tertiary);
        padding: 9px 12px 5px;
      }
      .watchlist-item {
        display: grid;
        grid-template-columns: 1fr auto auto auto;
        gap: 6px;
        align-items: center;
        padding: 6px 12px;
        border-top: 1px solid var(--border);
      }
      .watch-symbol {
        font-size: 12px;
        font-weight: 500;
      }
      .watch-price {
        font-size: 11px;
        color: var(--text-secondary);
        font-variant-numeric: tabular-nums;
        text-align: right;
      }
      .watch-change {
        font-size: 11px;
        font-variant-numeric: tabular-nums;
        min-width: 48px;
        text-align: right;
      }
      .watch-remove {
        background: none;
        border: none;
        color: var(--text-tertiary);
        cursor: pointer;
        font-size: 15px;
        line-height: 1;
        padding: 0 0 0 4px;
        opacity: 0.5;
        transition: opacity 0.15s, color 0.15s;
      }
      .watch-remove:hover { opacity: 1; color: var(--red); }
      .watchlist-empty {
        padding: 7px 12px 9px;
        font-size: 11px;
        color: var(--text-tertiary);
        border-top: 1px solid var(--border);
      }
      .watchlist-add {
        display: flex;
        gap: 5px;
        align-items: center;
        padding: 8px 10px 9px;
        border-top: 1px solid var(--border);
      }
      .watchlist-input {
        flex: 1;
        min-width: 0;
        background: var(--bg-hover);
        border: 1px solid var(--border);
        border-radius: var(--radius-sm);
        color: var(--text-primary);
        font-size: 12px;
        padding: 4px 7px;
        font-family: var(--font-mono);
        text-transform: uppercase;
        outline: none;
      }
      .watchlist-input::placeholder { text-transform: none; color: var(--text-tertiary); }
      .watchlist-input:focus { border-color: var(--border-focus); }
      .watchlist-exchange {
        background: var(--bg-hover);
        border: 1px solid var(--border);
        border-radius: var(--radius-sm);
        color: var(--text-secondary);
        font-size: 11px;
        padding: 4px 3px;
        width: 50px;
        font-family: inherit;
      }
      .watchlist-add-btn {
        background: var(--accent);
        border: none;
        border-radius: var(--radius-sm);
        color: #000;
        font-size: 18px;
        font-weight: 500;
        width: 26px;
        height: 26px;
        cursor: pointer;
        display: flex;
        align-items: center;
        justify-content: center;
        flex-shrink: 0;
        line-height: 1;
      }
      .watchlist-add-btn:hover { background: var(--accent-hover); }

      /* Tactile active feedback */
      .btn-setup:active,
      .watchlist-add-btn:active,
      .watch-remove:active,
      .mover-item:active,
      .watchlist-item:active,
      .footer a:active,
      .toggle-switch:active {
        transform: scale(0.97) translateY(0.5px);
        transition: transform 0.05s ease;
      }
    </style>
  </head>
  <body>
    <div class="header">
      <div class="header-left">
        <img src="icons/icon32.png" alt="MyTicker" />
        <h1>MyTicker</h1>
      </div>
      <span class="version-badge">v0.2</span>
    </div>

    <div class="toggle-row">
      <span class="toggle-label" id="toggleLabel">Ticker strip</span>
      <label class="toggle-switch">
        <input type="checkbox" id="enabledToggle" aria-labelledby="toggleLabel" />
        <span class="toggle-slider"></span>
      </label>
    </div>

    <div id="mainContent">
      <!-- Dynamically filled by popup.js -->
    </div>

    <div class="footer">
      <a id="openOptions" href="#">Open settings →</a>
    </div>

    <div class="shortcut-hint" id="shortcutHint"></div>

    <script type="module" src="popup.js"></script>
  </body>
</html>
