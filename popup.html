<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>MyTicker</title>
    <style>
      body {
        min-width: 260px;
        padding: 12px;
        font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }
      h1 {
        font-size: 16px;
        margin: 0 0 8px;
      }
      .row {
        display: flex;
        align-items: center;
        justify-content: space-between;
        margin-bottom: 8px;
      }
      button {
        padding: 4px 10px;
        font-size: 12px;
        cursor: pointer;
      }
      .summary {
        font-size: 12px;
        color: #4b5563;
      }
      .link {
        color: #2563eb;
        cursor: pointer;
        font-size: 12px;
        text-decoration: underline;
      }
    </style>
  </head>
  <body>
    <h1>MyTicker</h1>
    <div class="row">
      <span>Ticker strip</span>
      <label>
        <input type="checkbox" id="enabledToggle" />
        Enabled
      </label>
    </div>
    <div class="summary" id="summary">Loading…</div>
    <div style="margin-top: 8px;">
      <span id="openOptions" class="link">Open settings</span>
    </div>
    <script type="module" src="popup.js"></script>
  </body>
</html>
