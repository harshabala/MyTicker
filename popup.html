<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>MyTicker</title>
    <link rel="stylesheet" href="brand.css" />
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }

      body {
        min-width: 340px;
        max-width: 340px;
        padding: 14px 16px 16px;
        font: 100%/1.4 var(--font-sans);
        font-variant-numeric: tabular-nums;
        background: var(--bg);
        color: var(--text-primary);
        -webkit-font-smoothing: antialiased;
      }

      /* ── Header ── */
      .header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        margin-bottom: 12px;
      }
      .header-left {
        display: flex;
        align-items: center;
        gap: 8px;
      }
      .header-left img {
        width: 22px;
        height: 22px;
        border-radius: 5px;
      }
      .header-left h1 {
        font-size: 15px;
        font-weight: 600;
        letter-spacing: -0.02em;
      }
      .header-actions {
        display: flex;
        align-items: center;
        gap: 4px;
      }
      .icon-btn {
        width: 32px;
        height: 32px;
        border: 1px solid var(--border);
        border-radius: 8px;
        background: transparent;
        color: var(--text-secondary);
        cursor: pointer;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 16px;
        font-weight: 500;
        font-family: inherit;
        transition: background var(--motion-fast) var(--ease-out), color var(--motion-fast) var(--ease-out);
      }
      .icon-btn:hover {
        background: var(--bg-hover);
        color: var(--text-primary);
      }
      .icon-btn:focus-visible {
        outline: 2px solid var(--accent);
        outline-offset: 2px;
      }
      .icon-btn svg {
        width: 16px;
        height: 16px;
        stroke: currentColor;
        fill: none;
        stroke-width: 1.75;
        stroke-linecap: round;
        stroke-linejoin: round;
      }

      /* ── Tabs ── */
      .tabs {
        display: flex;
        gap: 0;
        border-bottom: 1px solid var(--border);
        margin-bottom: 14px;
      }
      .tab {
        flex: 1;
        padding: 10px 8px;
        border: none;
        background: transparent;
        color: var(--text-tertiary);
        font-size: 13px;
        font-weight: 600;
        font-family: inherit;
        cursor: pointer;
        position: relative;
        transition: color var(--motion-fast) var(--ease-out);
      }
      .tab:hover { color: var(--text-secondary); }
      .tab[aria-selected="true"] {
        color: var(--text-primary);
      }
      .tab[aria-selected="true"]::after {
        content: "";
        position: absolute;
        left: 20%;
        right: 20%;
        bottom: -1px;
        height: 2px;
        border-radius: 2px 2px 0 0;
        background: var(--accent);
      }
      .tab:focus-visible {
        outline: 2px solid var(--accent);
        outline-offset: -2px;
      }

      /* ── Hero card ── */
      .hero-card {
        background: var(--bg-surface);
        border: 1px solid var(--border);
        border-radius: var(--radius);
        padding: 16px;
        margin-bottom: 14px;
        box-shadow: var(--material-elevated-shadow);
      }
      .hero-top {
        display: flex;
        align-items: center;
        justify-content: space-between;
        margin-bottom: 6px;
      }
      .hero-label {
        font-size: 12px;
        font-weight: 500;
        color: var(--text-tertiary);
      }
      .live-pill {
        display: inline-flex;
        align-items: center;
        gap: 5px;
        font-size: 11px;
        font-weight: 500;
        color: var(--text-tertiary);
      }
      .live-pill .dot {
        width: 6px;
        height: 6px;
        border-radius: 50%;
        background: var(--green);
      }
      .live-pill.is-stale .dot {
        background: var(--yellow);
      }
      .pnl-row {
        display: flex;
        align-items: baseline;
        gap: 10px;
        margin-bottom: 14px;
      }
      .pnl-value {
        font-size: 28px;
        font-weight: 700;
        letter-spacing: -0.03em;
        line-height: 1.1;
        font-variant-numeric: tabular-nums;
      }
      .pnl-pct {
        font-size: 14px;
        font-weight: 600;
        font-variant-numeric: tabular-nums;
      }
      .pnl-positive { color: var(--green); }
      .pnl-negative { color: var(--red); }
      .pnl-flat { color: var(--text-secondary); }

      .stat-grid {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 8px;
        margin-bottom: 12px;
      }
      .stat-cell {
        background: var(--bg-inset);
        border-radius: var(--radius-sm);
        padding: 10px 12px;
      }
      .stat-cell-label {
        font-size: 11px;
        color: var(--text-tertiary);
        margin-bottom: 4px;
        font-weight: 500;
      }
      .stat-cell-value {
        font-size: 14px;
        font-weight: 600;
        font-variant-numeric: tabular-nums;
        color: var(--text-primary);
        letter-spacing: -0.01em;
      }
      .stat-cell-value .sub {
        font-size: 12px;
        font-weight: 500;
        margin-left: 4px;
        color: var(--text-secondary);
      }

      .help-row {
        font-size: 11px;
        color: var(--text-tertiary);
        line-height: 1.4;
        display: flex;
        align-items: center;
        gap: 4px;
        flex-wrap: wrap;
      }
      .help-row a {
        color: var(--text-tertiary);
        text-decoration: none;
      }
      .help-row a:hover {
        color: var(--text-secondary);
        text-decoration: underline;
      }
      .help-row .sep {
        opacity: 0.5;
      }

      /* ── Movers ── */
      .section-head {
        display: flex;
        align-items: center;
        justify-content: space-between;
        margin-bottom: 8px;
      }
      .section-head .label {
        font-size: 12px;
        font-weight: 600;
        color: var(--text-secondary);
      }
      .section-head .link-quiet {
        font-size: 12px;
        font-weight: 500;
        color: var(--text-tertiary);
        background: none;
        border: none;
        cursor: pointer;
        font-family: inherit;
        padding: 0;
      }
      .section-head .link-quiet:hover {
        color: var(--accent);
      }

      .movers-section {
        margin-bottom: 14px;
      }
      .mover-item {
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 10px 0;
        border-bottom: 1px solid var(--border);
        cursor: default;
      }
      .mover-item:last-child { border-bottom: none; }
      .mover-name {
        font-size: 13px;
        font-weight: 500;
        letter-spacing: -0.01em;
      }
      .mover-right {
        display: flex;
        align-items: baseline;
        gap: 10px;
      }
      .mover-money {
        font-size: 12px;
        font-weight: 500;
        font-variant-numeric: tabular-nums;
      }
      .mover-change {
        font-size: 12px;
        font-weight: 600;
        font-variant-numeric: tabular-nums;
        min-width: 3.6rem;
        text-align: right;
      }

      /* ── Strip control ── */
      .strip-card {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
        padding: 12px 14px;
        background: var(--bg-surface);
        border: 1px solid var(--border);
        border-radius: var(--radius);
        margin-bottom: 12px;
      }
      .strip-card-left {
        display: flex;
        align-items: center;
        gap: 10px;
        min-width: 0;
      }
      .strip-card-icon {
        width: 28px;
        height: 28px;
        border-radius: 8px;
        background: var(--bg-hover);
        display: flex;
        align-items: center;
        justify-content: center;
        flex-shrink: 0;
        color: var(--accent);
      }
      .strip-card-icon svg {
        width: 16px;
        height: 16px;
      }
      .strip-card-title {
        font-size: 13px;
        font-weight: 600;
      }
      .strip-card-sub {
        font-size: 11px;
        color: var(--text-tertiary);
        margin-top: 1px;
      }

      /* ── Toggle ── */
      .toggle-switch {
        position: relative;
        display: inline-block;
        width: 42px;
        height: 26px;
        flex-shrink: 0;
        cursor: pointer;
      }
      .toggle-switch input {
        opacity: 0;
        width: 0;
        height: 0;
        position: absolute;
      }
      .toggle-slider {
        position: absolute;
        inset: 0;
        background: var(--toggle-track, var(--bg-tertiary));
        border-radius: 999px;
        transition: background var(--motion-medium) var(--ease-out);
      }
      .toggle-slider::before {
        content: "";
        position: absolute;
        left: 2px;
        top: 50%;
        width: 22px;
        height: 22px;
        margin-top: -11px;
        background: var(--toggle-thumb, #fff);
        border-radius: 50%;
        box-shadow: var(--toggle-thumb-shadow, 0 1px 2px rgba(0,0,0,.35));
        transition: transform var(--motion-medium) var(--ease-out);
      }
      .toggle-switch input:checked + .toggle-slider {
        background: var(--accent);
      }
      .toggle-switch input:checked + .toggle-slider::before {
        transform: translateX(16px);
      }
      .toggle-switch input:focus-visible + .toggle-slider {
        outline: 2px solid var(--accent);
        outline-offset: 2px;
      }

      /* ── Footer meta ── */
      .footer-meta {
        display: flex;
        align-items: center;
        justify-content: space-between;
        font-size: 11px;
        color: var(--text-tertiary);
        padding: 0 2px;
      }
      .footer-meta .dot {
        width: 6px;
        height: 6px;
        border-radius: 50%;
        background: var(--green);
        display: inline-block;
        margin-right: 5px;
        vertical-align: middle;
      }
      .footer-meta.is-stale .dot { background: var(--yellow); }

      /* ── Watchlist tab ── */
      .watchlist-panel { min-height: 120px; }
      .watchlist-item {
        display: grid;
        grid-template-columns: minmax(0, 1fr) auto auto auto auto;
        gap: 8px;
        align-items: center;
        padding: 10px 0;
        border-bottom: 1px solid var(--border);
      }
      .watch-symbol { font-size: 13px; font-weight: 500; }
      .watch-price {
        font-size: 12px;
        color: var(--text-secondary);
        font-variant-numeric: tabular-nums;
      }
      .watch-change {
        font-size: 12px;
        font-variant-numeric: tabular-nums;
        min-width: 48px;
        text-align: right;
      }
      .watch-remove {
        background: none;
        border: none;
        color: var(--text-tertiary);
        cursor: pointer;
        font-size: 16px;
        min-width: 32px;
        min-height: 32px;
        border-radius: 6px;
        opacity: 0.6;
      }
      .watch-remove:hover { opacity: 1; color: var(--red); }
      .watchlist-empty {
        padding: 28px 12px;
        text-align: center;
        font-size: 13px;
        color: var(--text-tertiary);
        line-height: 1.45;
      }
      .watchlist-add {
        display: flex;
        gap: 6px;
        align-items: center;
        margin-top: 12px;
        padding-top: 12px;
        border-top: 1px solid var(--border);
      }
      .watchlist-input {
        flex: 1;
        min-width: 0;
        background: var(--bg-inset);
        border: 1px solid var(--border);
        border-radius: var(--radius-sm);
        color: var(--text-primary);
        font-size: 12px;
        padding: 8px 10px;
        font-family: var(--font-mono);
        text-transform: uppercase;
        outline: none;
      }
      .watchlist-input:focus-visible {
        border-color: var(--border-focus);
        box-shadow: var(--focus-ring);
      }
      .watchlist-exchange {
        background: var(--bg-inset);
        border: 1px solid var(--border);
        border-radius: var(--radius-sm);
        color: var(--text-secondary);
        font-size: 11px;
        padding: 8px 4px;
        width: 56px;
        font-family: inherit;
      }
      .watchlist-add-btn {
        background: var(--accent);
        border: none;
        border-radius: var(--radius-sm);
        color: var(--accent-ink);
        font-size: 18px;
        font-weight: 600;
        width: 36px;
        height: 36px;
        cursor: pointer;
        display: flex;
        align-items: center;
        justify-content: center;
      }
      .watchlist-add-btn:hover { background: var(--accent-hover); }

      /* ── Checklist / empty ── */
      .setup-checklist .label,
      .empty-state .title {
        font-size: 13px;
        font-weight: 600;
        margin-bottom: 10px;
      }
      .checklist-item {
        display: flex;
        gap: 10px;
        align-items: flex-start;
        padding: 10px 0;
        border-bottom: 1px solid var(--border);
        width: 100%;
        text-align: left;
        background: transparent;
        border-left: none;
        border-right: none;
        border-top: none;
        color: inherit;
        font-family: inherit;
        min-height: 44px;
      }
      button.checklist-item { cursor: pointer; border-radius: 8px; }
      button.checklist-item:hover { background: var(--bg-hover); }
      .checklist-item.done { opacity: 0.65; min-height: 0; padding: 6px 0; }
      .checklist-item.done .check-hint { display: none; }
      .check-icon {
        width: 24px;
        height: 24px;
        border-radius: 999px;
        background: var(--bg-hover);
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 11px;
        font-weight: 600;
        flex-shrink: 0;
      }
      .checklist-item.done .check-icon {
        background: var(--accent-muted);
        color: var(--accent);
      }
      .check-label { font-size: 13px; font-weight: 600; }
      .check-hint {
        font-size: 11px;
        color: var(--text-tertiary);
        margin-top: 2px;
        line-height: 1.4;
      }
      .btn-setup {
        width: 100%;
        margin-top: 14px;
        padding: 12px;
        min-height: 44px;
        border: none;
        border-radius: var(--radius-sm);
        background: var(--accent);
        color: var(--accent-ink);
        font-size: 13px;
        font-weight: 600;
        cursor: pointer;
        font-family: inherit;
      }
      .btn-setup:hover { background: var(--accent-hover); }
      .empty-state { padding: 8px 0; }
      .empty-state .subtitle {
        font-size: 12px;
        color: var(--text-secondary);
        line-height: 1.45;
      }

      .loading-state {
        text-align: center;
        padding: 32px;
        color: var(--text-tertiary);
        font-size: 13px;
      }
      .popup-view {
        transition: opacity var(--motion-medium) var(--ease-out);
      }
      .popup-view.view-enter,
      .popup-view.view-exit { opacity: 0; }

      .sr-only {
        position: absolute;
        width: 1px;
        height: 1px;
        padding: 0;
        margin: -1px;
        overflow: hidden;
        clip: rect(0,0,0,0);
        border: 0;
      }

      .shortcut-hint {
        text-align: center;
        font-size: 10px;
        color: var(--text-tertiary);
        margin-top: 10px;
      }
      .shortcut-hint kbd {
        background: var(--bg-hover);
        padding: 1px 5px;
        border-radius: 3px;
        font-family: inherit;
        font-size: 10px;
        border: 1px solid var(--border);
      }

      .add-sheet {
        display: none;
        margin-bottom: 12px;
        padding: 12px;
        background: var(--bg-surface);
        border: 1px solid var(--border);
        border-radius: var(--radius);
      }
      .add-sheet.is-open { display: block; }
      .add-sheet-title {
        font-size: 12px;
        font-weight: 600;
        color: var(--text-secondary);
        margin-bottom: 8px;
      }

      @media (prefers-reduced-motion: reduce) {
        .popup-view { transition: none; }
      }
    </style>
  </head>
  <body>
    <div class="header">
      <div class="header-left">
        <img src="icons/icon32.png" alt="" />
        <h1>MyTicker</h1>
      </div>
      <div class="header-actions">
        <button type="button" class="icon-btn" id="addWatchBtn" aria-label="Add to watchlist" title="Add to watchlist">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>
        </button>
        <button type="button" class="icon-btn" id="openOptions" aria-label="Settings" title="Settings">
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <circle cx="12" cy="12" r="3"/>
            <path d="M12 1v2M12 21v2M4.2 4.2l1.4 1.4M18.4 18.4l1.4 1.4M1 12h2M21 12h2M4.2 19.8l1.4-1.4M18.4 5.6l1.4-1.4"/>
          </svg>
        </button>
      </div>
    </div>

    <div class="tabs" role="tablist" aria-label="Popup sections">
      <button type="button" class="tab" role="tab" id="tabHoldings" aria-selected="true" aria-controls="panelHoldings" tabindex="0">Holdings</button>
      <button type="button" class="tab" role="tab" id="tabWatchlist" aria-selected="false" aria-controls="panelWatchlist" tabindex="-1">Watchlist</button>
    </div>

    <div class="add-sheet" id="addSheet" hidden>
      <div class="add-sheet-title">Add watchlist symbol</div>
      <div class="watchlist-add" style="margin:0;padding:0;border:none;">
        <input type="text" class="watchlist-input" id="quickAddInput" placeholder="SYMBOL" maxlength="20" aria-label="Watchlist symbol" />
        <select class="watchlist-exchange" id="quickAddExchange" aria-label="Exchange">
          <option value="NSE">NSE</option>
          <option value="BSE">BSE</option>
          <option value="US">US</option>
        </select>
        <button type="button" class="watchlist-add-btn" id="quickAddBtn" aria-label="Add">+</button>
      </div>
    </div>

    <div id="mainContent">
      <div id="panelHoldings" role="tabpanel" aria-labelledby="tabHoldings"></div>
      <div id="panelWatchlist" role="tabpanel" aria-labelledby="tabWatchlist" hidden></div>
    </div>
    <div class="shortcut-hint" id="shortcutHint" hidden></div>

    <script type="module" src="popup.js"></script>
  </body>
</html>
