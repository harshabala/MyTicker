<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>MyTicker</title>
    <link rel="stylesheet" href="brand.css" />
    <style>
      :root {
        --bg-primary: var(--bg);
        --bg-card: var(--bg-surface);
        --bg-card-hover: var(--bg-hover);
        --radius: var(--radius-sm);
        --font-display: "SF Pro Display", -apple-system, BlinkMacSystemFont, system-ui, sans-serif;
      }

      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      body {
        min-width: 320px;
        max-width: 320px;
        padding: 16px;
        font: 100%/1.45 var(--font-sans);
        background: var(--bg-primary);
        color: var(--text-primary);
        -webkit-font-smoothing: antialiased;
        -moz-osx-font-smoothing: grayscale;
        letter-spacing: 0;
      }

      /* Header */
      .header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        margin-bottom: 16px;
      }

      .header-left {
        display: flex;
        align-items: center;
        gap: 8px;
      }

      .header-left img {
        width: 20px;
        height: 20px;
        border-radius: 4px;
      }

      .header-left h1 {
        font-family: var(--font-display);
        font-size: 15px;
        font-weight: 600;
        letter-spacing: -0.02em; /* display: negative tracking */
        line-height: 1.2;
        font-optical-sizing: auto;
      }

      .version-badge {
        font-size: 10px;
        color: var(--text-tertiary);
        background: rgba(255, 255, 255, 0.04);
        padding: 2px 6px;
        border-radius: 4px;
        font-weight: 500;
      }

      /* Toggle switch */
      .toggle-row {
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 10px 12px;
        background: var(--bg-card);
        border: 1px solid var(--border);
        border-radius: var(--radius);
        margin-bottom: 12px;
        box-shadow: var(--material-elevated-shadow);
      }

      .toggle-label {
        font-size: 13px;
        font-weight: 500;
        color: var(--text-primary);
        letter-spacing: -0.01em;
      }

      .toggle-btn,
      .btn-secondary {
        background: transparent;
        color: var(--text-primary);
        border: 1px solid var(--border);
        transition:
          background var(--motion-fast) var(--ease-out),
          border-color var(--motion-fast) var(--ease-out),
          transform var(--motion-press) var(--ease-press);
      }

      .toggle-btn:hover,
      .btn-secondary:hover {
        background: rgba(255, 255, 255, 0.08);
        border-color: var(--accent);
      }

      /* Feedback on press (pointer-down), not only release */
      .toggle-btn:active,
      .btn-secondary:active {
        background: rgba(255, 255, 255, 0.12);
        transform: scale(0.97);
      }

      .toggle-switch {
        position: relative;
        width: 51px;
        height: 31px;
        cursor: pointer;
        /* ~10px hit padding beyond visual control */
        margin: -4px;
        padding: 4px;
        flex-shrink: 0;
      }

      .toggle-switch input {
        opacity: 0;
        width: 0;
        height: 0;
      }

      .toggle-slider {
        position: absolute;
        inset: 4px;
        background: var(--bg-tertiary);
        border-radius: 999px;
        transition: background var(--motion-medium) var(--ease-out-quint, var(--ease-out));
      }

      .toggle-slider::before {
        content: "";
        position: absolute;
        left: 2px;
        top: 2px;
        width: 27px;
        height: 27px;
        background: white;
        border-radius: 50%;
        box-shadow: 0 1px 2px rgba(0, 0, 0, 0.35);
        transition: transform var(--motion-medium) var(--ease-out-quint, var(--ease-out));
      }

      .toggle-switch input:checked + .toggle-slider {
        background: var(--accent);
      }

      .toggle-switch input:checked + .toggle-slider::before {
        transform: translateX(20px);
      }

      /* Summary card — material surface */
      .summary-card {
        background: var(--bg-card);
        border: 1px solid var(--border);
        border-radius: var(--radius);
        padding: 14px;
        margin-bottom: 12px;
        box-shadow: var(--material-elevated-shadow);
      }

      .summary-card .label {
        font-size: 12px;
        font-weight: 600;
        color: var(--text-secondary);
        margin-bottom: 6px;
        letter-spacing: 0.01em; /* small labels: slight positive tracking */
        line-height: 1.3;
      }

      .pnl-row {
        display: flex;
        align-items: baseline;
        gap: 8px;
        margin-bottom: 2px;
      }

      .pnl-value {
        font-family: var(--font-display);
        font-size: 26px;
        font-weight: 700;
        letter-spacing: -0.03em; /* large display: tight tracking */
        line-height: 1.05;
        font-variant-numeric: tabular-nums;
        font-optical-sizing: auto;
      }

      .pnl-pct {
        font-size: 14px;
        font-weight: 600;
        letter-spacing: -0.01em;
        font-variant-numeric: tabular-nums;
      }

      .holdings-count {
        font-size: 12px;
        color: var(--text-tertiary);
        margin-top: 6px;
        line-height: 1.4;
      }

      .pnl-positive { color: var(--green); }
      .pnl-negative { color: var(--red); }
      .pnl-flat { color: var(--text-secondary); }

      /* Status bar */
      .status-bar {
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 8px 12px;
        background: var(--bg-card);
        border: 1px solid var(--border);
        border-radius: var(--radius);
        margin-bottom: 12px;
        box-shadow: var(--material-elevated-shadow);
      }

      .status-dot {
        width: 6px;
        height: 6px;
        border-radius: 50%;
        background: var(--green);
        margin-right: 6px;
        display: inline-block;
        /* Soft status pulse — not a slow vestibular loop; ease brightness only */
        animation: pulse-dot 2.4s var(--ease-out) infinite;
      }

      .status-dot.disconnected {
        background: var(--red);
        animation: none;
      }

      .status-dot.stale {
        background: var(--yellow);
        animation: none;
      }

      .status-text {
        font-size: 11px;
        color: var(--text-tertiary);
        display: flex;
        align-items: center;
      }

      .status-time {
        font-size: 11px;
        color: var(--text-tertiary);
      }

      @keyframes pulse-dot {
        0%, 100% { opacity: 1; }
        50% { opacity: 0.3; }
      }

      /* Top movers */
      .movers-section {
        margin-bottom: 12px;
      }

      .movers-section .label {
        font-size: 12px;
        font-weight: 600;
        color: var(--text-secondary);
        margin-bottom: 8px;
        letter-spacing: 0.01em;
      }

      .mover-item {
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 10px 12px;
        background: var(--bg-card);
        border: 1px solid var(--border);
        border-radius: var(--radius-sm);
        margin-bottom: 4px;
        box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.04);
        transition:
          background var(--motion-fast) var(--ease-out),
          transform var(--motion-press) var(--ease-press);
      }

      .mover-item:hover {
        background: var(--bg-card-hover);
      }

      .mover-name {
        font-size: 13px;
        font-weight: 500;
        letter-spacing: -0.01em;
      }

      .mover-change {
        font-size: 13px;
        font-weight: 600;
        letter-spacing: -0.01em;
        font-variant-numeric: tabular-nums;
      }

      /* Footer link */
      .footer {
        text-align: center;
        margin-top: 4px;
      }

      .footer a {
        font-size: 12px;
        color: var(--accent);
        text-decoration: none;
        cursor: pointer;
        opacity: 0.8;
        transition: opacity 0.15s;
      }

      .footer a:hover {
        opacity: 1;
        text-decoration: underline;
      }

      /* Empty state */
      .empty-state {
        text-align: center;
        padding: 24px 12px;
      }

      .empty-state .emoji {
        font-size: 28px;
        margin-bottom: 8px;
      }

      .empty-state .title {
        font-size: 14px;
        font-weight: 600;
        margin-bottom: 4px;
      }

      .empty-state .subtitle {
        font-size: 12px;
        color: var(--text-tertiary);
        line-height: 1.5;
      }

      /* Keyboard shortcut hint */
      .shortcut-hint {
        text-align: center;
        font-size: 10px;
        color: var(--text-tertiary);
        margin-top: 8px;
      }

      .shortcut-hint kbd {
        background: rgba(255, 255, 255, 0.06);
        padding: 1px 5px;
        border-radius: 3px;
        font-family: inherit;
        font-size: 10px;
        border: 1px solid var(--border);
      }

      .loading-state {
        text-align: center;
        padding: 24px;
        color: var(--text-tertiary);
        font-size: 13px;
      }

      /* View machine: opacity cross-fade only (symmetric path) */
      .popup-view {
        transition: opacity var(--motion-medium) var(--ease-out);
      }

      .popup-view.view-enter {
        opacity: 0;
      }

      .popup-view.view-exit {
        opacity: 0;
      }

      /* Sign-change feedback: brief dim, not a flashy keyframe bounce */
      .summary-card.pnl-flash {
        animation: pnl-flash var(--motion-medium) var(--ease-out);
      }

      @keyframes pnl-flash {
        0% { opacity: 1; }
        40% { opacity: 0.72; }
        100% { opacity: 1; }
      }

      /* Checklist enter: short opacity stagger (no large travel) */
      .checklist-stagger .checklist-item {
        opacity: 0;
        animation: checklist-stagger var(--motion-medium) var(--ease-out) forwards;
        animation-delay: calc(var(--stagger-index, 0) * 40ms + 20ms);
      }

      @keyframes checklist-stagger {
        to {
          opacity: 1;
        }
      }

      @media (prefers-reduced-motion: reduce) {
        .status-dot {
          animation: none;
        }

        .checklist-stagger .checklist-item {
          opacity: 1;
          animation: none;
        }

        .summary-card.pnl-flash {
          animation: none;
        }

        .popup-view {
          transition: opacity 200ms ease;
        }
      }

      .setup-checklist .checklist-item {
        display: flex;
        gap: 10px;
        align-items: flex-start;
        padding: 10px 8px;
        margin: 0 -8px;
        border-bottom: 1px solid var(--border);
        width: calc(100% + 16px);
        text-align: left;
        background: transparent;
        border-left: none;
        border-right: none;
        border-top: none;
        color: inherit;
        font-family: inherit;
        cursor: default;
        /* hit padding for incomplete CTA rows */
        min-height: 44px;
        box-sizing: border-box;
      }

      button.checklist-item {
        cursor: pointer;
        border-radius: var(--radius-sm);
      }

      button.checklist-item:hover {
        background: rgba(255, 255, 255, 0.05);
      }

      button.checklist-item:focus-visible {
        outline: 2px solid var(--accent);
        outline-offset: 2px;
      }

      .setup-checklist .checklist-item:last-of-type {
        border-bottom: none;
      }

      .setup-checklist .checklist-item.done {
        min-height: 0;
        padding-top: 6px;
        padding-bottom: 6px;
        opacity: 0.72;
      }

      .setup-checklist .checklist-item.done .check-hint {
        display: none;
      }

      .setup-checklist .check-icon {
        width: 24px;
        height: 24px;
        border-radius: 999px;
        background: var(--bg-hover);
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 11px;
        font-weight: 600;
        flex-shrink: 0;
        transition: background var(--motion-fast) var(--ease-out), color var(--motion-fast) var(--ease-out);
      }

      .setup-checklist .checklist-item.done .check-icon {
        background: var(--accent-muted);
        color: var(--accent);
      }

      .check-label {
        font-size: 13px;
        font-weight: 600;
        letter-spacing: -0.01em;
        line-height: 1.3;
      }

      .check-hint {
        font-size: 11px;
        color: var(--text-tertiary);
        margin-top: 3px;
        line-height: 1.4;
        letter-spacing: 0.01em;
      }

      .stats-footnote,
      .privacy-line {
        font-size: 11px;
        color: var(--text-tertiary);
        line-height: 1.45;
        margin-top: 10px;
        letter-spacing: 0.01em;
      }

      .stats-footnote a {
        color: var(--accent);
        text-decoration: none;
      }

      .stats-footnote a:hover {
        text-decoration: underline;
      }

      .privacy-line {
        margin-top: 4px;
      }

      .strip-status-line {
        font-size: 12px;
        font-weight: 500;
        color: var(--text-secondary);
        line-height: 1.4;
        margin: 0 0 12px;
        padding: 0 2px;
        letter-spacing: -0.01em;
      }

      /* First-value: opacity only (state feedback, not decorative scale) */
      .summary-card.first-value {
        animation: first-value-in var(--motion-medium) var(--ease-out) both;
      }

      @keyframes first-value-in {
        from { opacity: 0.4; }
        to { opacity: 1; }
      }

      @media (prefers-reduced-motion: reduce) {
        .summary-card.first-value {
          animation: none;
        }
      }

      .btn-setup {
        width: 100%;
        margin-top: 12px;
        padding: 12px 10px;
        min-height: 44px;
        border: none;
        border-radius: var(--radius-sm);
        background: var(--accent);
        color: #000;
        font-size: 13px;
        font-weight: 600;
        letter-spacing: -0.01em;
        cursor: pointer;
        font-family: inherit;
        transition:
          background var(--motion-fast) var(--ease-out),
          transform var(--motion-press) var(--ease-press);
      }

      .btn-setup:hover {
        background: var(--accent-hover);
      }

      .footer a:active {
        transform: scale(0.98);
      }

      .btn-setup:focus-visible,
      .footer a:focus-visible,
      #openOptions:focus-visible {
        outline: 2px solid var(--accent);
        outline-offset: 2px;
        border-radius: 4px;
      }

      .toggle-switch input:focus-visible + .toggle-slider {
        outline: 2px solid var(--accent);
        outline-offset: 2px;
        border-radius: 999px;
      }

      /* Watchlist section styles */
      .watchlist-section {
        background: var(--bg-card);
        border: 1px solid var(--border);
        border-radius: var(--radius);
        margin-bottom: 12px;
        overflow: hidden;
        box-shadow: var(--material-elevated-shadow);
      }
      .watchlist-header {
        font-size: 11px;
        font-weight: 500;
        text-transform: uppercase;
        letter-spacing: 0.06em;
        color: var(--text-tertiary);
        padding: 9px 12px 5px;
      }
      .watchlist-item {
        display: grid;
        grid-template-columns: 1fr auto auto auto;
        gap: 6px;
        align-items: center;
        padding: 6px 12px;
        border-top: 1px solid var(--border);
      }
      .watch-symbol {
        font-size: 12px;
        font-weight: 500;
      }
      .watch-price {
        font-size: 11px;
        color: var(--text-secondary);
        font-variant-numeric: tabular-nums;
        text-align: right;
      }
      .watch-change {
        font-size: 11px;
        font-variant-numeric: tabular-nums;
        min-width: 48px;
        text-align: right;
      }
      .watch-remove {
        background: none;
        border: none;
        color: var(--text-tertiary);
        cursor: pointer;
        font-size: 15px;
        line-height: 1;
        padding: 0 0 0 4px;
        opacity: 0.5;
        transition: opacity 0.15s, color 0.15s;
      }
      .watch-remove:hover { opacity: 1; color: var(--red); }
      .watchlist-empty {
        padding: 7px 12px 9px;
        font-size: 11px;
        color: var(--text-tertiary);
        border-top: 1px solid var(--border);
      }
      .watchlist-add {
        display: flex;
        gap: 5px;
        align-items: center;
        padding: 8px 10px 9px;
        border-top: 1px solid var(--border);
      }
      .watchlist-input {
        flex: 1;
        min-width: 0;
        background: var(--bg-hover);
        border: 1px solid var(--border);
        border-radius: var(--radius-sm);
        color: var(--text-primary);
        font-size: 12px;
        padding: 4px 7px;
        font-family: var(--font-mono);
        text-transform: uppercase;
        outline: none;
      }
      .watchlist-input::placeholder { text-transform: none; color: var(--text-tertiary); }
      .watchlist-input:focus { border-color: var(--border-focus); }
      .watchlist-exchange {
        background: var(--bg-hover);
        border: 1px solid var(--border);
        border-radius: var(--radius-sm);
        color: var(--text-secondary);
        font-size: 11px;
        padding: 4px 3px;
        width: 50px;
        font-family: inherit;
      }
      .watchlist-add-btn {
        background: var(--accent);
        border: none;
        border-radius: var(--radius-sm);
        color: #000;
        font-size: 18px;
        font-weight: 500;
        width: 26px;
        height: 26px;
        cursor: pointer;
        display: flex;
        align-items: center;
        justify-content: center;
        flex-shrink: 0;
        line-height: 1;
      }
      .watchlist-add-btn:hover { background: var(--accent-hover); }

      /* Tactile active feedback — press path is short and snappy */
      .btn-setup:active,
      .watchlist-add-btn:active,
      .watch-remove:active,
      .mover-item:active,
      .watchlist-item:active,
      .footer a:active {
        transform: scale(0.97);
        transition: transform var(--motion-press) var(--ease-press);
      }

      .watchlist-add-btn {
        transition:
          background var(--motion-fast) var(--ease-out),
          transform var(--motion-press) var(--ease-press);
      }

      @media (prefers-reduced-transparency: reduce) {
        .summary-card,
        .toggle-row,
        .status-bar,
        .watchlist-section,
        .mover-item {
          box-shadow: none;
          background: #1c1c1e;
        }
      }
    </style>
  </head>
  <body>
    <div class="header">
      <div class="header-left">
        <img src="icons/icon32.png" alt="MyTicker" />
        <h1>MyTicker</h1>
      </div>
      <span class="version-badge">v0.2</span>
    </div>

    <div class="toggle-row">
      <span class="toggle-label" id="toggleLabel">Ticker strip</span>
      <label class="toggle-switch">
        <input type="checkbox" id="enabledToggle" aria-labelledby="toggleLabel" />
        <span class="toggle-slider"></span>
      </label>
    </div>

    <div id="mainContent">
      <!-- Dynamically filled by popup.js -->
    </div>

    <div class="footer">
      <a id="openOptions" href="#">Open settings →</a>
    </div>

    <div class="shortcut-hint" id="shortcutHint"></div>

    <script type="module" src="popup.js"></script>
  </body>
</html>
